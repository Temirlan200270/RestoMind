# Blueprint для деплоя RestoMind на https://dashboard.render.com
# 1. Создайте New -> Blueprint
# 2. Подключите ваш репозиторий
# 3. В Environment задайте DATABASE_URL (Supabase или другой managed PostgreSQL) и секреты из sync: false
#
# База данных не создаётся этим файлом — используйте Supabase или вставьте URL существующего Postgres (см. docs/SUPABASE_MIGRATION.md).

services:
  - type: web
    name: restomind
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    
    # Сначала выполняем миграции БД в отдельном слое
    preDeployCommand: alembic upgrade head
    
    # Затем запускаем сервер (без alembic, чтобы не было конфликта аргументов)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: DB_MODE
        value: postgres
      # Supabase session pooler (:5432) — ~15 clients на весь проект; 2 conn на процесс (web + worker).
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_MEMORY_ONLY
        value: "true"
      
      # PostgreSQL: Supabase (рекомендуется) или URL из Render/Railway — см. docs/SUPABASE_MIGRATION.md
      - key: DATABASE_URL
        sync: false

      # Автоматическое определение URL сервиса (нужно для Webhook WhatsApp)
      - key: PUBLIC_BASE_URL
        fromContext: instance_url

      - key: SESSION_SECRET
        generateValue: true

      # Секреты (нужно будет заполнить вручную в Dashboard после создания)
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      
      # Дополнительные настройки iiko (если есть)
      - key: IIKO_API_LOGIN
        sync: false
      - key: IIKO_ORGANIZATION_ID
        sync: false
      # Опционально: авто-импорт меню из iiko (сек). 0 по умолчанию в коде; типично 3600–21600.
      # - key: IIKO_MENU_AUTO_SYNC_INTERVAL_SECONDS
      #   value: "10800"
