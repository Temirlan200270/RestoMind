# Blueprint для деплоя RestoMind на https://dashboard.render.com
# 1. Создайте New -> Blueprint
# 2. Подключите ваш репозиторий
# 3. После деплоя зайдите в Dashboard -> Environment и заполните пустые секреты (OpenAI, WhatsApp и т.д.)

databases:
  - name: restomind-db
    plan: free
    databaseName: restomind_db
    user: restomind

services:
  - type: web
    name: restomind
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    
    # Сначала выполняем миграции БД в отдельном слое
    preDeployCommand: alembic upgrade head
    
    # Затем запускаем сервер (без alembic, чтобы не было конфликта аргументов)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: DB_MODE
        value: postgres
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_MEMORY_ONLY
        value: "true"
      
      # Подключение к базе данных Render
      - key: DATABASE_URL
        fromDatabase:
          name: restomind-db
          property: connectionString

      # Автоматическое определение URL сервиса (нужно для Webhook WhatsApp)
      - key: PUBLIC_BASE_URL
        fromContext: instance_url

      - key: SESSION_SECRET
        generateValue: true

      # Секреты (нужно будет заполнить вручную в Dashboard после создания)
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      
      # Дополнительные настройки iiko (если есть)
      - key: IIKO_API_LOGIN
        sync: false
      - key: IIKO_ORGANIZATION_ID
        sync: false