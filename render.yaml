# Blueprint для https://dashboard.render.com → New → Blueprint
# Подключите GitHub/GitLab; после деплоя укажите секреты с sync: false вручную (или через Dashboard).

databases:
  - name: restomind-db
    plan: free
    databaseName: restomind_db
    user: restomind

services:
  - type: web
    name: restomind
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: DB_MODE
        value: postgres
      - key: REDIS_ENABLED
        value: "false"
      # Для тестов без внешнего Redis (квота Upstash и т.д.): REDIS_MEMORY_ONLY=true
      # Опционально: Upstash / внешний Redis — задайте в Dashboard (секрет), не коммитьте:
      # REDIS_URL=rediss://default:...@....upstash.io:6379
      # REDIS_SSL_SKIP_VERIFY=false
      - key: DATABASE_URL
        fromDatabase:
          name: restomind-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Опционально: явный публичный URL (без /admin). На Render обычно хватает RENDER_EXTERNAL_URL —
      # приложение подставит его в public_base_url, если PUBLIC_BASE_URL не задан.
      # - key: PUBLIC_BASE_URL
      #   value: https://restomind.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
