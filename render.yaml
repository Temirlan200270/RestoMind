# Blueprint для деплоя RestoMind на https://dashboard.render.com
# 1. Создайте New -> Blueprint
# 2. Подключите ваш репозиторий
# 3. В Environment задайте DATABASE_URL (Supabase или другой managed PostgreSQL) и секреты из sync: false
#
# База данных не создаётся этим файлом — используйте Supabase или вставьте URL существующего Postgres (см. docs/SUPABASE_MIGRATION.md).
#
# Production/staging: после Blueprint в Dashboard задайте REDIS_URL (Upstash TCP rediss://…),
# включите worker-сервис ниже. См. docs/DEPLOY_RUNBOOK.md §2.

services:
  - type: web
    name: restomind
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    
    # Сначала выполняем миграции БД в отдельном слое
    preDeployCommand: alembic upgrade head
    
    # Затем запускаем сервер (без alembic, чтобы не было конфликта аргументов)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_MODE
        value: postgres
      # Supabase session pooler (:5432) — ~15 clients на весь проект.
      # SUPABASE_PREFER_TRANSACTION_POOLER=true переписывает :5432 → :6543 (рекомендуется на Render).
      - key: SUPABASE_PREFER_TRANSACTION_POOLER
        value: "true"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_MEMORY_ONLY
        value: "false"
      - key: ARQ_ENABLED
        value: "true"
      - key: ARQ_QUEUE_NAME
        value: restomind
      # Upstash / Render Redis — задайте в Dashboard (sync: false):
      - key: REDIS_URL
        sync: false
      
      # PostgreSQL: Supabase (рекомендуется) или URL из Render/Railway — см. docs/SUPABASE_MIGRATION.md
      - key: DATABASE_URL
        sync: false

      # Автоматическое определение URL сервиса (нужно для Webhook WhatsApp)
      - key: PUBLIC_BASE_URL
        fromContext: instance_url

      - key: SESSION_SECRET
        generateValue: true

      # Секреты (нужно будет заполнить вручную в Dashboard после создания)
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      
      # Дополнительные настройки iiko (если есть)
      - key: IIKO_API_LOGIN
        sync: false
      - key: IIKO_ORGANIZATION_ID
        sync: false

  - type: worker
    name: restomind-worker
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: python -m arq app.worker.WorkerSettings

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_MODE
        value: postgres
      - key: SUPABASE_PREFER_TRANSACTION_POOLER
        value: "true"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_MEMORY_ONLY
        value: "false"
      - key: ARQ_ENABLED
        value: "true"
      - key: ARQ_QUEUE_NAME
        value: restomind
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        fromService:
          type: web
          name: restomind
          envVarKey: SESSION_SECRET
