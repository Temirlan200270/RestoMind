# Blueprint для https://dashboard.render.com → New → Blueprint
# Подключите GitHub/GitLab; после деплоя укажите секреты с sync: false вручную (или через Dashboard).

databases:
  - name: restomind-db
    plan: free
    databaseName: restomind_db
    user: restomind

services:
  - type: web
    name: restomind
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: DB_MODE
        value: postgres
      - key: REDIS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: restomind-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
