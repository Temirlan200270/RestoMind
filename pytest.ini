[pytest]
# Явный корень тестов — чтобы pytest не «шарил» по всему репозиторию.
testpaths = tests

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    regression: регрессионные сценарии §E10 / plan §4.7 (медленнее обычных unit-тестов)

# CI-polish: известные устаревающие предупреждения внешних SDK не должны
# «желтить» вывод. Фильтры узкие (по категории + тексту), чтобы не маскировать
# будущие FutureWarning от нашего кода или других зависимостей.
#
# (?s) включает DOTALL — текст предупреждения реально начинается с "\n\n", и
# без DOTALL `re.match` не попадает на "All support for ...".
filterwarnings =
    ignore:(?s).*google\.generativeai.*:FutureWarning
