services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_MODE: postgres
      POSTGRES_HOST: db
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      MESSAGING_GATEWAY_URL: http://messaging-gateway:3107
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  messaging-gateway:
    build:
      context: ./services/messaging-gateway
    env_file: .env
    environment:
      PORT: "3107"
      RESTOMIND_API_URL: http://app:8000
      RESTOMIND_GATEWAY_SECRET: ${MESSAGING_GATEWAY_SECRET:-}
      SESSION_ROOT: /sessions
    ports:
      - "3107:3107"
    volumes:
      - messaging_sessions:/sessions
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restomind
      POSTGRES_PASSWORD: restomind_secret
      POSTGRES_DB: restomind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restomind -d restomind_db"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  messaging_sessions:
