{% macro settings_tabs() -%}
<div class="mb-6">
  <div class="inline-flex flex-wrap gap-2 rounded-2xl bg-white border border-gray-100 shadow-sm p-2">
    <button type="button"
      @click="setSettingsTab('restaurant')"
      :class="settingsTab === 'restaurant' ? 'bg-brand-600 text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-50 border border-gray-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Мой ресторан
    </button>
    <button type="button"
      @click="setSettingsTab('connections')"
      :class="settingsTab === 'connections' ? 'bg-brand-600 text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-50 border border-gray-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Подключения
    </button>
    <button type="button"
      @click="setSettingsTab('smart_sales')"
      :class="settingsTab === 'smart_sales' ? 'bg-brand-600 text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-50 border border-gray-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Умные продажи
    </button>
    <button type="button"
      @click="setSettingsTab('team')"
      :class="settingsTab === 'team' ? 'bg-brand-600 text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-50 border border-gray-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Команда
    </button>
    <button type="button"
      @click="setSettingsTab('health')"
      :class="settingsTab === 'health' ? 'bg-slate-800 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Состояние
    </button>
    <button type="button"
      @click="setSettingsTab('technical')"
      :class="settingsTab === 'technical' ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Технический доступ
    </button>
    <button type="button"
      @click="setSettingsTab('bot_test')"
      :class="settingsTab === 'bot_test' ? 'bg-emerald-700 text-white shadow-sm' : 'bg-white text-emerald-800 hover:bg-emerald-50 border border-emerald-200'"
      class="px-4 py-2 rounded-xl text-sm font-semibold transition min-h-[44px]">
      Тест бота
    </button>
  </div>
  <div x-show="settingsTab === 'technical'" x-cloak class="mt-3 rounded-2xl border border-amber-200 bg-amber-50/70 px-4 py-3 text-sm text-amber-900">
    Здесь — расширенные действия. Используйте только если точно понимаете последствия.
  </div>
  <div x-show="settingsTab === 'bot_test'" x-cloak class="mt-3 rounded-2xl border border-emerald-200 bg-emerald-50/70 px-4 py-3 text-sm text-emerald-900">
    Безопасная песочница: сообщения уходят в ИИ, операционные данные и гостевые чаты не затрагиваются.
  </div>
</div>
{%- endmacro %}
