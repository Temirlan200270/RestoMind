{# Карточка секции (Stripe-like): caller() — тело. title — опциональный заголовок. #}
{% macro ui_card(title='', extra_class='') -%}
<div class="rm-card-surface p-6 {{ extra_class }}">
  {% if title %}
  <h3 class="text-base font-bold text-gray-900 mb-4">{{ title }}</h3>
  {% endif %}
  {{ caller() }}
</div>
{%- endmacro %}
