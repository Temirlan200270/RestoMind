{# Плитка KPI: подпись + значение (caller) #}
{% macro ui_stat_tile(label='') -%}
<div class="rounded-2xl bg-white border border-gray-100 shadow-sm p-5 min-w-0">
  <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">{{ label }}</p>
  <div class="text-2xl md:text-3xl font-extrabold text-gray-900 tabular-nums">
    {{ caller() }}
  </div>
</div>
{%- endmacro %}
