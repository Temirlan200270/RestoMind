{% macro color_picker(label, name='', value='#2563eb', extra_class='', attrs='') -%}
<label class="block {{ extra_class }}" style="margin-bottom: var(--space-4);">
  {% if label %}<span class="text-xs font-semibold uppercase tracking-wide ds-text-muted" style="display:block; margin-bottom: var(--space-2);">{{ label }}</span>{% endif %}
  <div class="flex flex-wrap items-center gap-3">
    <input type="color" class="ds-rounded-lg ds-border" style="width: 3rem; height: 2.5rem; padding: 2px; cursor: pointer; background: var(--color-surface);" {% if name %}name="{{ name }}"{% endif %} value="{{ value }}" {{ attrs|safe }} />
    <code class="text-xs ds-text-muted">{{ value }}</code>
  </div>
</label>
{%- endmacro %}
