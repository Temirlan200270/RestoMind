            {% from "components/_skeleton.html" import skeleton %}
            {% from "components/_card.html" import card %}
            {% from "components/_section_header.html" import section_header %}
            <!-- ========== G10 SHIFT STATE MACHINE (Focus-Driven OS Sprint 2 split) ========== -->
            <div x-show="currentTab === 'shift'" x-cloak class="fade-in space-y-5 max-w-7xl"
                x-effect="shiftState?.focus?.id; mobileActiveScreen = 'focus'">
                <div class="flex flex-wrap items-end justify-between gap-4">
                    <div class="min-w-0">
                        {{ section_header('Смена', subtitle='Один экран — одно следующее действие.', extra_class='!mb-0') }}
                        <div class="flex flex-wrap items-center gap-2 mt-2 text-sm text-slate-600">
                            <span class="ds-badge ds-badge-neutral text-[11px]" x-show="shiftState?.state"
                                x-text="'Режим ' + (shiftState?.state || '—')"></span>
                            <span x-show="orgProfile?.operational_label" x-text="orgProfile?.operational_label"></span>
                        </div>
                    </div>
                    <button type="button" @click="loadShiftState(true)" :disabled="shiftStateLoading"
                        class="ds-btn ds-btn-secondary ds-btn-md min-h-[44px]">Обновить</button>
                </div>

                <div x-show="shiftStateLoading && !shiftState" class="h-28 rounded-2xl bg-slate-100 animate-pulse"></div>

                <template x-if="shiftStateDegraded && shiftState">
                    <div class="rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-950" role="alert">
                        <span class="font-semibold">Данные смены могут быть устаревшими.</span>
                        <span class="ml-1" x-text="shiftStateLoadError || 'Повторите обновление.'"></span>
                    </div>
                </template>

                <template x-if="shiftState && !shiftStateLoading">
                    <div class="space-y-5">
                        <!-- Metrics strip (all states) -->
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                            <div class="rounded-2xl bg-red-50 ring-1 ring-red-200/80 px-4 py-3">
                                <div class="text-[10px] font-bold uppercase text-red-700">Под риском</div>
                                <div class="text-2xl font-black tabular-nums text-red-950 mt-1"
                                    x-text="fmt.money(shiftState.metrics?.risk_kzt ?? 0)"></div>
                            </div>
                            <div class="rounded-2xl bg-emerald-50 ring-1 ring-emerald-200/80 px-4 py-3">
                                <div class="text-[10px] font-bold uppercase text-emerald-800">Сохранено сегодня</div>
                                <div class="text-2xl font-black tabular-nums text-emerald-950 mt-1"
                                    x-text="fmt.money(shiftState.metrics?.saved_today_kzt ?? 0)"></div>
                            </div>
                            <div class="rounded-2xl bg-amber-50 ring-1 ring-amber-200/80 px-4 py-3">
                                <div class="text-[10px] font-bold uppercase text-amber-800">В очереди</div>
                                <div class="text-2xl font-black tabular-nums text-amber-950 mt-1"
                                    x-text="shiftState.metrics?.at_risk_count ?? 0"></div>
                            </div>
                            <div class="rounded-2xl bg-slate-50 ring-1 ring-slate-200/80 px-4 py-3">
                                <div class="text-[10px] font-bold uppercase text-slate-600">Приоритет</div>
                                <div class="text-2xl font-black tabular-nums text-slate-900 mt-1"
                                    x-text="Math.round(shiftState.priority_score || 0)"></div>
                            </div>
                        </div>

                        <!-- S5 Emergency -->
                        <template x-if="shiftState.state === 'S5'">
                            {% call card(padding_class='p-6', extra_class='!border-red-600 !bg-red-950 text-white') %}
                                <h3 class="text-lg font-black uppercase tracking-wide">Система перегружена</h3>
                                <p class="text-sm text-red-100 mt-2">Слишком много рисков одновременно. Действуйте по одному пункту.</p>
                            {% endcall %}
                        </template>

                        <!-- S1 Critical -->
                        <template x-if="shiftState.state === 'S1'">
                            {% call card(padding_class='p-5', extra_class='!border-red-500 !bg-red-50/90') %}
                                <p class="text-xs font-bold uppercase text-red-700">Критично — деньги теряются сейчас</p>
                            {% endcall %}
                        </template>

                        <!-- S4 Recovery -->
                        <template x-if="shiftState.state === 'S4'">
                            {% call card(padding_class='p-5', extra_class='!border-amber-300 !bg-amber-50/80') %}
                                <p class="text-xs font-bold uppercase text-amber-900">Режим возврата — черновики и оплаты</p>
                            {% endcall %}
                        </template>

                        <!-- S2 Working -->
                        <template x-if="shiftState.state === 'S2'">
                            {% call card(padding_class='p-5', extra_class='!border-violet-200 !bg-violet-50/60') %}
                                <p class="text-xs font-bold uppercase text-violet-900">Рабочий режим — обрабатывайте очередь</p>
                            {% endcall %}
                        </template>

                        <!-- S3 Calm -->
                        <template x-if="shiftState.state === 'S3'">
                            {% call card(padding_class='p-5', extra_class='!border-emerald-200 !bg-emerald-50/60') %}
                                <p class="text-xs font-bold uppercase text-emerald-900">Смена стабильна</p>
                            {% endcall %}
                        </template>

                        <!-- S0 Idle -->
                        <template x-if="shiftState.state === 'S0'">
                            {% call card(padding_class='p-8 text-center', extra_class='!border-dashed !border-slate-200') %}
                                <div class="text-4xl mb-2">💚</div>
                                <p class="font-semibold text-slate-800">Сейчас спокойно</p>
                                <p class="text-sm text-slate-500 mt-1">Нет срочных потерь по текущему фильтру точки.</p>
                            {% endcall %}
                        </template>

                        <!-- Projection gap: system truth ≠ empty projection -->
                        <template x-if="shiftState.presentation?.projection_gap && !shiftState.focus">
                            {% call card(padding_class='p-4', extra_class='!border-amber-300 !bg-amber-50/90') %}
                                <p class="text-xs font-bold uppercase text-amber-900">Расхождение: смена под нагрузкой</p>
                                <p class="text-sm text-amber-950 mt-1"
                                    x-text="'Причина режима: ' + (shiftState.presentation?.state_reason || shiftState.state) + '. В очереди ещё ' + (shiftState.metrics?.queue_size_active ?? 0) + ' из ' + (shiftState.metrics?.queue_size ?? 0) + ' сигналов.'"></p>
                            {% endcall %}
                        </template>

                        <!-- Empty focus (strict: API presentation only; never calm unless ui_may_show_calm_empty) -->
                        <template x-if="!shiftState.focus && shiftState.presentation?.empty_focus_reason && !shiftState.presentation?.ui_may_show_calm_empty">
                            {% call card(padding_class='p-4', extra_class='!border-slate-300 !bg-slate-50') %}
                                <p class="text-sm font-semibold text-slate-800"
                                    x-show="shiftState.presentation.empty_focus_reason === 'all_filtered'">
                                    Все пункты просмотрены или закрыты. Обновите экран или дождитесь новых сигналов.
                                </p>
                                <p class="text-sm font-semibold text-slate-800"
                                    x-show="shiftState.presentation.empty_focus_reason === 'action_queue_cleared'">
                                    Срочные задачи по очереди закрыты. Режим <span x-text="shiftState.state"></span> — <span x-text="shiftState.presentation.state_reason"></span>.
                                </p>
                                <p class="text-sm text-slate-600"
                                    x-show="shiftState.presentation.empty_focus_reason === 'no_signals'">
                                    Нет активных сигналов по выбранной точке.
                                </p>
                                <div class="mt-3 flex flex-wrap items-center gap-2"
                                    x-show="shiftState.metrics?.shift_empty_focus_while_risk_positive && ((shiftState.metrics?.excluded_skip || 0) + (shiftState.metrics?.excluded_next || 0)) > 0">
                                    <button type="button"
                                        @click="runShiftStateAction('reset_skips', null)"
                                        :disabled="shiftActionLoading === 'reset_skips'"
                                        class="ds-btn ds-btn-secondary ds-btn-sm disabled:opacity-50">
                                        <span x-text="shiftActionLoading === 'reset_skips' ? 'Сбрасываем…' : 'Показать пропущенные снова'"></span>
                                    </button>
                                    <span class="text-xs text-slate-500"
                                        x-text="'Скрыто оператором: ' + ((shiftState.metrics?.excluded_skip || 0) + (shiftState.metrics?.excluded_next || 0))"></span>
                                </div>
                            {% endcall %}
                        </template>

                        <!-- Focus Deck + Context Dock (desktop split, mobile staged) -->
                        <template x-if="shiftState.focus">
                            <div>
                                <button type="button"
                                    x-show="mobileActiveScreen === 'context'"
                                    @click="backToShiftFocus()"
                                    class="ds-shift-staged-back ds-btn ds-btn-secondary ds-btn-md min-h-[44px] mb-4 lg:hidden w-full">
                                    ⬅ Назад к задаче
                                </button>

                                <div class="ds-shift-split"
                                    :class="shiftHasContextDock() ? '' : 'ds-shift-split--solo'">
                                    <!-- Left: Focus Deck -->
                                    <div class="ds-shift-focus-pane"
                                        :class="shiftMobileShowsFocus() ? '' : 'ds-shift-pane--hidden-mobile'">
                                        {% call card(padding_class='p-0', extra_class='overflow-hidden !border-2 !border-violet-300') %}
                                            <div class="px-5 py-4 bg-violet-600 text-white">
                                                <div class="text-xs font-bold uppercase tracking-wide opacity-90">Следующее действие</div>
                                                <p class="text-[11px] mt-1 opacity-80" x-show="shiftState.presentation?.focus_ownership === 'other'">
                                                    Другой оператор уже взял эту задачу — дождитесь или выберите «Другое дело».
                                                </p>
                                            </div>
                                            <div class="px-5 py-5">
                                                <div class="flex flex-wrap items-center gap-2 mb-2">
                                                    <span class="text-xs font-bold uppercase text-violet-700"
                                                        x-text="moneyQueueKindLabel(shiftState.focus?.kind)"></span>
                                                    <span x-show="shiftState.focus?.wait_minutes > 0"
                                                        class="text-xs tabular-nums text-slate-500"
                                                        x-text="shiftState.focus.wait_minutes + ' мин'"></span>
                                                    <span x-show="shiftState.focus?.value_kzt > 0"
                                                        class="text-lg font-black tabular-nums text-red-700"
                                                        x-text="fmt.money(shiftState.focus.value_kzt)"></span>
                                                </div>
                                                <div class="text-lg font-bold text-slate-900" x-text="shiftState.focus?.title"></div>
                                                <p class="text-sm text-slate-600 mt-1" x-text="shiftState.focus?.subtitle"></p>
                                                <div class="flex flex-wrap gap-2 mt-5">
                                                    <template x-for="(act, idx) in (shiftState.focus?.actions || []).slice(0, 1)" :key="'fa-' + idx">
                                                        <button type="button" @click="runShiftFocusAction(act)"
                                                            class="ds-btn ds-btn-primary ds-btn-md min-h-[44px]"
                                                            x-text="act.label"></button>
                                                    </template>
                                                    <button type="button"
                                                        x-show="shiftHasContextDock()"
                                                        @click="openShiftContext()"
                                                        class="ds-btn ds-btn-secondary ds-btn-md min-h-[44px] lg:hidden">
                                                        Контекст
                                                    </button>
                                                    <template x-for="act in (shiftState.actions || [])" :key="'sa-' + act.id">
                                                        <button type="button"
                                                            @click="runShiftStateAction(act.subtype, shiftState.focus?.id)"
                                                            :disabled="shiftActionLoading === act.id"
                                                            class="ds-btn ds-btn-secondary ds-btn-md min-h-[44px] disabled:opacity-50"
                                                            :title="act.hint || ''"
                                                            x-text="shiftActionLoading === act.id ? '…' : act.label"></button>
                                                    </template>
                                                </div>
                                            </div>
                                        {% endcall %}

                                        <!-- Queue preview: S2 = actionable; S4 = context only -->
                                        <template x-if="shiftState.state === 'S2' && (shiftState.queue || []).length > 0">
                                            {% call card(padding_class='p-0', extra_class='overflow-hidden opacity-90') %}
                                                <div class="px-5 py-3 border-b border-slate-100 bg-slate-50">
                                                    <h3 class="text-sm font-semibold text-slate-700">Дальше в очереди</h3>
                                                </div>
                                                <div class="divide-y divide-slate-100">
                                                    <template x-for="item in (shiftState.queue || [])" :key="'q-' + item.id">
                                                        <div class="px-5 py-3 flex items-center justify-between gap-3 text-sm">
                                                            <div class="min-w-0 truncate">
                                                                <span class="font-medium" x-text="item.title"></span>
                                                                <span x-show="item.value_kzt > 0" class="ml-2 tabular-nums text-red-700 font-semibold"
                                                                    x-text="fmt.money(item.value_kzt)"></span>
                                                            </div>
                                                            <button type="button" @click="runShiftFocusAction((item.actions || [])[0])"
                                                                class="text-xs font-semibold text-brand-700 shrink-0">Открыть</button>
                                                        </div>
                                                    </template>
                                                </div>
                                            {% endcall %}
                                        </template>

                                        <template x-if="shiftState.state === 'S4' && (shiftState.queue || []).length > 0">
                                            {% call card(padding_class='p-4', extra_class='!border-slate-200 !bg-slate-50/70 opacity-75') %}
                                                <p class="text-[10px] font-bold uppercase text-slate-500 mb-2">Контекст очереди</p>
                                                <ul class="space-y-1 text-xs text-slate-600">
                                                    <template x-for="item in (shiftState.queue || [])" :key="'qc-' + item.id">
                                                        <li class="truncate">
                                                            <span x-text="item.title"></span>
                                                            <span x-show="item.value_kzt > 0" class="ml-1 tabular-nums text-slate-500"
                                                                x-text="'· ' + fmt.money(item.value_kzt)"></span>
                                                        </li>
                                                    </template>
                                                </ul>
                                            {% endcall %}
                                        </template>
                                    </div>

                                    <!-- Right: Context Dock -->
                                    <div class="ds-shift-context-pane"
                                        x-show="shiftHasContextDock()"
                                        :class="shiftMobileShowsContext() ? '' : 'ds-shift-pane--hidden-mobile'">
                                        <div x-show="shiftFocusShowsChatDock()" x-cloak>
                                            {% include "screens/_shift_focus_chat.html" %}
                                        </div>
                                        <div x-show="shiftFocusShowsOrderDock()" x-cloak>
                                            {% include "screens/_shift_focus_order.html" %}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
