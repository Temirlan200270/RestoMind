                                    :class="integrationStatus.telegram_configured ? 'bg-emerald-500 shadow-[0_0_0_3px_rgba(16,185,129,0.25)]' : 'bg-gray-300'"></span>
                                <div class="min-w-0 flex-1">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <div class="font-medium text-gray-900">Telegram для команды</div>
                                        <span class="text-xs font-bold text-brand-700">Настроить</span>
                                    </div>
                                    <p class="text-sm text-gray-600 mt-1" x-text="integrationStatus.telegram_configured ? 'Бот и чат для срочных уведомлений настроены — SOS уходит персоналу.' : 'Укажите ключ бота и чат в разделе «Профиль и логистика», чтобы получать запросы оператору.'"></p>
                                </div>
                            </summary>
                            <div class="mt-4 ml-6 rounded-xl border border-gray-200 bg-gray-50/50 p-4 text-sm text-gray-600">
                                <p>Ключ бота и чат персонала хранятся в профиле ресторана. Откройте профиль, если нужно обновить канал уведомлений для команды.</p>
                                <button type="button" @click="setSettingsTab('restaurant')" class="mt-3 rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-semibold text-gray-800 hover:bg-gray-50 min-h-[44px]">
                                    Открыть профиль
                                </button>
                            </div>
                        </details>

                    </div>

                    <div class="mt-6 pt-6 border-t border-gray-100 flex flex-wrap gap-3 items-center">
                        <button type="button" @click="syncIntegrationsNow()"
                            :disabled="integrationSyncLoading || !integrationStatus.iiko_configured"
                            class="inline-flex items-center gap-2 px-5 py-3 rounded-xl text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm shadow-brand-600/20">
                            <span x-show="!integrationSyncLoading">Обновить меню и стоп-листы сейчас</span>
                            <span x-show="integrationSyncLoading" x-cloak>Обновляем…</span>
                        </button>
                        <button type="button" @click="syncMenuOnlyFromEnv()"
                            :disabled="integrationSyncLoading || !integrationStatus.iiko_configured"
                            class="inline-flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-semibold border border-gray-200 bg-white text-gray-800 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                            Только меню
                        </button>
                        <button type="button" @click="syncMenuReplaceFromIiko()"
                            :disabled="integrationSyncLoading || !integrationStatus.iiko_configured"
                            class="inline-flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-semibold border border-amber-200 bg-amber-50 text-amber-900 hover:bg-amber-100 disabled:opacity-40 disabled:cursor-not-allowed">
                            Заменить меню из iiko
                        </button>
                        <details class="hint-details w-full mt-2 rounded-xl border border-gray-200/80 bg-gray-50/50 px-3 py-2">
                            <summary class="cursor-pointer text-xs font-medium text-gray-600 select-none flex items-center gap-2">
                                <svg class="w-3.5 h-3.5 text-gray-400 shrink-0 transition-transform duration-200 hint-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                Что обновится по кнопкам
                            </summary>
                            <p class="text-xs text-gray-500 mt-2 pl-5 border-l-2 border-gray-200 ml-0.5">Полная кнопка обновляет меню и стоп-листы. «Только меню» обновляет блюда и цены без проверки стоп-листов. «Заменить меню» убирает старые позиции iiko, которых больше нет в новой выгрузке; добавленные вручную блюда не трогает.</p>
                        </details>
                    </div>

                    <div class="rm-card-nested p-4 mb-6">
                        <h4 class="text-sm font-semibold text-gray-900 mb-1">Для техспециалиста: поиск по меню</h4>
                        <p class="text-xs text-gray-600 mb-3 leading-relaxed">После крупного обновления меню можно пересобрать быстрый поиск, чтобы бот точнее находил блюда и не держал лишний список позиций в ответе.</p>
                        <button type="button" @click="reindexMenuEmbeddings()" :disabled="menuEmbeddingsReindexLoading"
                            class="px-4 py-2.5 rounded-xl bg-slate-800 text-white text-sm font-semibold hover:bg-slate-900 disabled:opacity-40 min-h-[44px] rm-focusable">
                            <span x-show="!menuEmbeddingsReindexLoading">Пересобрать поиск по меню</span>
                            <span x-show="menuEmbeddingsReindexLoading" x-cloak>Пересобираем…</span>
                        </button>
                    </div>

                    <div>
                        <h4 class="text-sm font-semibold text-gray-900 mb-2">История обновлений</h4>
                        <div class="rounded-xl border border-gray-200 bg-white max-h-56 overflow-y-auto text-xs font-mono">
                            <template x-for="(ev, ei) in integrationEvents" :key="ei">
                                <div class="px-3 py-2 border-b border-gray-50 flex gap-2"
                                    :class="ev.ok ? 'text-gray-700' : 'text-red-700 bg-red-50/50'">
                                    <span class="text-gray-400 shrink-0" x-text="ev.created_at ? fmt.time(ev.created_at) : ''"></span>
                                    <span class="flex-1 min-w-0 break-words" x-text="ev.message"></span>
                                </div>
                            </template>
                            <p x-show="!integrationEvents.length" class="px-3 py-6 text-center text-gray-400">Записей пока нет — нажмите «Обновить меню и стоп-листы» или дождитесь фонового обновления стоп-листов</p>
                        </div>
                    </div>
                </div>
                </div>
            </div>
            </template>
