<div x-show="currentTab === 'intelligence'" x-cloak class="fade-in space-y-5 pb-16">
    <div class="grid gap-3 md:grid-cols-4">
        <div class="rounded-lg border border-gray-200 bg-white p-4">
            <div class="text-xs font-semibold uppercase text-gray-500">Выручка сегодня</div>
            <div class="mt-2 text-2xl font-bold text-gray-900" x-text="fmtMoney(intelligenceData?.summary?.current?.revenue || 0)"></div>
            <div class="mt-1 text-xs" :class="trendClass(intelligenceData?.summary?.changes?.revenue_pct)" x-text="formatTrendPct(intelligenceData?.summary?.changes?.revenue_pct)"></div>
        </div>
        <div class="rounded-lg border border-gray-200 bg-white p-4">
            <div class="text-xs font-semibold uppercase text-gray-500">Заказы</div>
            <div class="mt-2 text-2xl font-bold text-gray-900" x-text="intelligenceData?.summary?.current?.orders || 0"></div>
            <div class="mt-1 text-xs" :class="trendClass(intelligenceData?.summary?.changes?.orders_pct)" x-text="formatTrendPct(intelligenceData?.summary?.changes?.orders_pct)"></div>
        </div>
        <div class="rounded-lg border border-gray-200 bg-white p-4">
            <div class="text-xs font-semibold uppercase text-gray-500">Средний чек</div>
            <div class="mt-2 text-2xl font-bold text-gray-900" x-text="fmtMoney(intelligenceData?.summary?.current?.avg_check || 0)"></div>
            <div class="mt-1 text-xs" :class="trendClass(intelligenceData?.summary?.changes?.avg_check_pct)" x-text="formatTrendPct(intelligenceData?.summary?.changes?.avg_check_pct)"></div>
        </div>
        <div class="rounded-lg border border-gray-200 bg-white p-4">
            <div class="text-xs font-semibold uppercase text-gray-500">Отмены</div>
            <div class="mt-2 text-2xl font-bold text-gray-900" x-text="intelligenceData?.summary?.current?.cancelled_orders || 0"></div>
            <div class="mt-1 text-xs text-gray-500" x-text="`${intelligenceData?.summary?.current?.cancel_rate_pct || 0}% от потока`"></div>
        </div>
    </div>

    <div class="grid gap-5 xl:grid-cols-[minmax(0,1fr)_360px]">
        <section class="rounded-lg border border-gray-200 bg-white p-4 md:p-5">
            <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-gray-900">AI-аналитик</h2>
                    <p class="mt-1 text-sm text-gray-500">Вопросы по выручке, заказам, среднему чеку и отменам.</p>
                </div>
                <button type="button" class="rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50" @click="loadIntelligence()">Обновить</button>
            </div>

            <form class="mt-4 flex flex-col gap-3 md:flex-row" @submit.prevent="askIntelligence()">
                <input
                    type="text"
                    class="min-h-[44px] flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
                    x-model="intelligenceQuestion"
                    placeholder="Почему сегодня меньше заказов?"
                >
                <button type="submit" class="min-h-[44px] rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700 disabled:opacity-60" :disabled="intelligenceAsking">
                    <span x-show="!intelligenceAsking">Спросить</span>
                    <span x-show="intelligenceAsking">Считаю...</span>
                </button>
            </form>

            <div class="mt-4 rounded-lg bg-gray-50 p-4 text-sm text-gray-800 min-h-[92px]">
                <template x-if="intelligenceAnswer">
                    <div>
                        <div class="text-xs font-semibold uppercase text-gray-500">Ответ</div>
                        <p class="mt-2 leading-6" x-text="intelligenceAnswer"></p>
                    </div>
                </template>
                <template x-if="!intelligenceAnswer">
                    <p class="text-gray-500">Задайте вопрос или выберите быстрый сценарий ниже.</p>
                </template>
            </div>

            <div class="mt-4 flex flex-wrap gap-2">
                <template x-for="q in intelligenceQuickQuestions" :key="q">
                    <button type="button" class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 hover:border-brand-300 hover:text-brand-700" @click="askIntelligence(q)" x-text="q"></button>
                </template>
            </div>
        </section>

        <aside class="rounded-lg border border-gray-200 bg-white p-4 md:p-5">
            <h2 class="text-lg font-semibold text-gray-900">Инсайты</h2>
            <div class="mt-4 space-y-3">
                <template x-for="ins in intelligenceData.insights || []" :key="ins.id">
                    <div class="rounded-lg border p-3" :class="insightBorderClass(ins.severity)">
                        <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <div class="text-sm font-semibold text-gray-900" x-text="ins.title"></div>
                                <p class="mt-1 text-sm text-gray-600" x-text="ins.summary"></p>
                            </div>
                            <button type="button" class="shrink-0 text-xs font-medium text-gray-500 hover:text-gray-900" @click="updateInsightStatus(ins.id, 'dismissed')">Скрыть</button>
                        </div>
                    </div>
                </template>
                <div x-show="!(intelligenceData.insights || []).length" class="text-sm text-gray-500">Инсайты появятся после расчета метрик.</div>
            </div>
        </aside>
    </div>
</div>
