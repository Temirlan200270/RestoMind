        <header class="shrink-0 glass border-b border-gray-200 px-3 sm:px-4 md:px-8 py-2.5 md:py-4 z-10 min-w-0 max-w-full overflow-x-clip"
            :class="currentTab === 'chats' && activeChatPhone ? 'max-md:hidden' : ''">
            <!-- Мобильная шапка: один компактный ряд -->
            <div class="flex items-center gap-2 md:hidden min-w-0">
                <h1 class="flex-1 min-w-0 text-base font-bold text-gray-900 truncate"
                    x-text="currentTab === 'settings'
                      ? (settingsTab === 'restaurant' ? 'Профиль'
                        : settingsTab === 'branding' ? 'Бренд'
                        : settingsTab === 'connections' ? 'Интеграции'
                        : settingsTab === 'smart_sales' ? 'Допродажи'
                        : settingsTab === 'team' ? 'Команда'
                        : settingsTab === 'health' ? 'Состояние'
                        : settingsTab === 'technical' ? (isSuperadmin ? 'Данные' : 'Экспорт')
                        : settingsTab === 'bot_test' ? 'Бот / ИИ'
                        : 'Настройки')
                      : (navItems.find(i => i.id === currentTab)?.label || 'RestoMind')">
                </h1>
                <!-- Статус работы заведения -->
                <span x-show="orgProfile && orgProfile.operational_label" x-cloak
                    class="shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full border"
                    :class="orgProfile.is_kitchen_open ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : (orgProfile.is_business_open ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-gray-50 border-gray-200 text-gray-500')"
                    x-text="orgProfile.is_kitchen_open ? 'Открыто' : (orgProfile.is_business_open ? 'Принимаем' : 'Закрыто')">
                </span>
                <button type="button" @click="openGlobalSearch()"
                    class="shrink-0 min-h-[40px] min-w-[40px] inline-flex items-center justify-center rounded-xl text-gray-500"
                    aria-label="Поиск">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </button>
            </div>

            <!-- Десктопная шапка -->
            <div class="hidden md:flex flex-col gap-2 min-w-0 md:flex-row md:items-start md:justify-between md:gap-3">
                <div class="flex items-center gap-2 md:gap-3 min-w-0 md:flex-1 md:min-w-0">
                    <div class="min-w-0 flex-1">
                        <!-- Multi-tenant брендинг: выбор филиала или просто имя -->
                        <div class="flex items-center gap-2 mb-1 min-w-0" x-show="authenticated" x-cloak>
                            <div class="h-7 w-7 rounded-xl text-white flex items-center justify-center text-xs font-bold shrink-0 ring-1 ring-black/5 overflow-hidden"
                                :style="headerBrandAvatarStyle()">
                                <template x-if="userData?.branding?.brand_logo_url">
                                    <img :src="userData.branding.brand_logo_url" class="h-full w-full object-cover">
                                </template>
                                <template x-if="!userData?.branding?.brand_logo_url">
                                    <span x-text="headerBrandInitialLetter()"></span>
                                </template>
                            </div>
                            <div class="min-w-0">
                                <template x-if="(userData?.available_organizations || []).length > 1">
                                    <div class="relative" x-data="{ open: false }" @click.away="open = false">
                                        <button @click="open = !open" class="flex items-center gap-1.5 text-xs font-bold text-gray-900 hover:text-brand-700 transition min-w-0 group text-left">
                                            <span class="truncate" x-text="orgProfile?.name || '—'"></span>
                                            <svg class="w-3 h-3 text-gray-400 group-hover:text-brand-500 transition shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/></svg>
                                        </button>
                                        <div x-show="open" x-cloak class="absolute left-0 mt-2 w-56 rounded-xl bg-white shadow-2xl ring-1 ring-black/5 z-[60] py-1 border border-gray-100 overflow-hidden">
                                            <template x-for="org in userData.available_organizations" :key="org.id">
                                                <button @click="selectOrganization(org.id); open = false" 
                                                    class="w-full px-4 py-2.5 text-left text-xs transition flex items-center justify-between"
                                                    :class="org.id === orgProfile?.id ? 'bg-brand-50 text-brand-700 font-bold' : 'text-gray-700 hover:bg-gray-50'">
                                                    <span x-text="org.name"></span>
                                                    <svg x-show="org.id === orgProfile?.id" class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="(userData?.available_organizations || []).length <= 1">
                                    <div class="text-xs font-semibold text-gray-700 truncate" x-text="orgProfile?.name || '—'"></div>
                                </template>
                                <div class="text-[9px] text-gray-400 uppercase font-bold tracking-tight"
                                    x-show="userData?.tenant?.name && String(userData.tenant.name).toLowerCase() !== 'default'"
                                    x-text="String(userData?.tenant?.name || '').toLowerCase() === 'default' ? '' : (userData?.tenant?.name || '')"></div>
                            </div>
                            <div class="text-[10px] text-gray-400 tabular-nums shrink-0"
                                x-show="(settingsEnv?.app_debug || isSuperadmin) && orgProfile?.organization_id"
                                x-cloak
                                x-text="'ID ' + orgProfile.organization_id"></div>
                            <span x-show="isDemoSession" x-cloak class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-100 text-violet-800 border border-violet-200 shrink-0">Демо</span>
                        </div>
                        <div class="flex items-center gap-2 min-w-0">
                            <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-gray-900 truncate flex-1 min-w-0"
                                x-text="currentTab === 'settings'
                                  ? (settingsTab === 'restaurant' ? 'Профиль и логистика'
                                    : settingsTab === 'branding' ? 'Бренд'
                                    : settingsTab === 'connections' ? 'Интеграции'
                                    : settingsTab === 'smart_sales' ? 'Допродажи'
                                    : settingsTab === 'team' ? 'Команда'
                                    : settingsTab === 'health' ? 'Состояние'
                                    : settingsTab === 'technical' ? (isSuperadmin ? 'Данные и безопасность' : 'Экспорт')
                                    : settingsTab === 'bot_test' ? 'Бот / ИИ'
                                    : 'Настройки')
                                  : (navItems.find(i => i.id === currentTab)?.label)"></h1>
                            <button type="button" @click="openGlobalSearch()"
                                class="md:hidden shrink-0 min-h-[44px] min-w-[44px] inline-flex items-center justify-center rounded-xl border border-gray-200 bg-white text-gray-500 hover:bg-gray-50"
                                title="Быстрый поиск (Ctrl+K)" aria-label="Поиск по заказам и чатам">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </button>
                        </div>
                        <p class="hidden sm:block text-sm text-gray-500 mt-0.5 line-clamp-2"
                            x-text="currentTab === 'settings'
                              ? (settingsTab === 'restaurant' ? 'Профиль заведения, график, упаковка, предоплата и база знаний'
                                : settingsTab === 'branding' ? 'Логотип, цвет и имя бренда в шапке и на чеке'
                                : settingsTab === 'connections' ? 'iiko, WhatsApp, Telegram и статусы синхронизации'
                                : settingsTab === 'smart_sales' ? 'Правила допродаж и сценарии бота'
                                : settingsTab === 'team' ? 'Роли staff и доступ к панели'
                                : settingsTab === 'health' ? 'Диагностика интеграций и готовность сервиса'
                                : settingsTab === 'technical' ? (isSuperadmin ? 'Экспорт, ретеншн и опасная зона' : 'Скачать данные заказов и чатов в CSV')
                                : settingsTab === 'bot_test' ? 'Проверка ответов ИИ без влияния на гостей'
                                : '')
                              : (navItems.find(i => i.id === currentTab)?.desc)"></p>
                        <button type="button"
                            x-show="authenticated && (setupStatus.score ?? 100) < 100"
                            x-cloak
                            @click="openSetupChecklist()"
                            class="mt-2 inline-flex min-h-[44px] max-w-full items-center gap-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-semibold text-amber-900 hover:bg-amber-100">
                            <span class="h-2 w-2 rounded-full bg-amber-500"></span>
                            <span class="tabular-nums" x-text="'Готовность ' + (setupStatus.score ?? 0) + '%'"></span>
                            <span class="text-amber-800/70 tabular-nums" x-text="setupDoneCount() + '/' + setupTotalCount()"></span>
                        </button>
                        <div x-show="false" x-cloak class="w-full max-w-md mt-2">
                            <div class="rounded-2xl p-3 border transition"
                                :class="(setupStatus.score ?? 0) <= 30
                                  ? 'border-amber-200 bg-amber-50/70 shadow-sm'
                                  : 'border-gray-200 bg-white/60'">
                                <div class="flex flex-wrap items-center justify-between gap-2 text-[10px]"
                                    :class="(setupStatus.score ?? 0) <= 30 ? 'text-amber-900' : 'text-gray-500'">
                                    <span class="font-semibold tracking-wide shrink-0 tabular-nums"
                                        x-text="'Готовность филиала — ' + (setupStatus.score ?? 0) + '%'"></span>
                                    <button type="button"
                                        x-show="(setupStatus.score ?? 0) > 30"
                                        class="ml-auto shrink-0 px-2 py-1 rounded-lg border text-[10px] font-semibold min-h-[28px]"
                                        :class="(setupStatus.score ?? 0) <= 30 ? 'border-amber-300 bg-white/80 text-amber-900' : 'border-gray-200 bg-white text-gray-700 hover:bg-gray-50'"
                                        @click="setupProgressExpanded = !setupProgressExpanded">
                                        <span x-text="setupProgressExpanded ? 'Свернуть' : 'Развернуть'"></span>
                                    </button>
                                </div>
                                <div x-show="(setupStatus.score ?? 0) <= 30 || setupProgressExpanded" x-cloak class="mt-2 space-y-2">
                                    <div class="h-2 rounded-full overflow-hidden"
                                        :class="(setupStatus.score ?? 0) <= 30 ? 'bg-amber-200/70' : 'bg-gray-200'">
                                        <div class="h-full transition-all duration-700"
                                            :class="(setupStatus.score ?? 0) <= 30 ? 'bg-amber-500' : 'bg-emerald-500'"
                                            :style="'width:' + (setupStatus.score || 0) + '%'"></div>
                                    </div>
                                    <p class="text-[10px] leading-snug"
                                        :class="(setupStatus.score ?? 0) <= 30 ? 'text-amber-800' : 'text-gray-500'">
                                        <span x-show="(setupStatus.score ?? 0) === 0" x-cloak>100% — когда закрыты все 6 пунктов ниже (каждый даёт ~17%).</span>
                                        <span x-show="(setupStatus.score ?? 0) > 0 && (setupStatus.score ?? 0) < 100" x-cloak>До 100% осталось закрыть перечисленное — нажмите «Открыть» у нужного пункта.</span>
                                    </p>
                                    <ul class="space-y-1.5 max-h-40 overflow-y-auto pr-0.5" x-show="setupIncompleteSteps().length" x-cloak>
                                        <template x-for="s in setupIncompleteSteps()" :key="s.id">
                                            <li class="flex items-start gap-2 rounded-lg bg-white/80 border border-gray-100 px-2 py-1.5">
                                                <span class="mt-0.5 h-1.5 w-1.5 rounded-full bg-amber-400 shrink-0" aria-hidden="true"></span>
                                                <div class="min-w-0 flex-1">
                                                    <div class="text-[10px] font-semibold text-gray-800" x-text="s.label"></div>
                                                    <p class="text-[10px] text-gray-500 leading-snug mt-0.5" x-text="s.hint || ''"></p>
                                                </div>
                                                <button type="button"
                                                    class="shrink-0 text-[10px] font-bold text-brand-600 hover:text-brand-700 px-1.5 py-0.5 rounded-lg border border-brand-200 bg-brand-50/80"
                                                    @click="navigateToTab('settings', { settingsTab: s.open_tab || 'connections' })">
                                                    Открыть
                                                </button>
                                            </li>
                                        </template>
                                    </ul>
                                    <div class="flex items-center justify-end gap-2 pt-0.5">
                                        <button type="button"
                                            class="shrink-0 px-3 py-1.5 rounded-xl text-[10px] font-bold transition border min-h-[32px]"
                                            :class="(setupStatus.score ?? 0) <= 30
                                              ? 'bg-amber-600 text-white border-amber-600 hover:bg-amber-700'
                                              : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'"
                                            @click="openFirstIncompleteSetupStep()">
                                            Следующий шаг
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto max-w-full shrink-0 pb-0.5 md:pb-0 md:flex-wrap md:overflow-visible md:justify-end admin-header-actions-scroll">
                    <template x-if="currentTab === 'menu'">
                        <div class="shrink-0">
                            {% call tabs_pills() %}
                            <button type="button" :class="menuView === 'catalog' ? 'ds-segmented-active' : ''" @click="setMenuView('catalog')">Каталог</button>
                            <button type="button" :class="menuView === 'stoplist' ? 'ds-segmented-active' : ''" @click="setMenuView('stoplist')">Стоп лист</button>
                            {% endcall %}
                        </div>
                    </template>
                    <button type="button" @click="openGlobalSearch()"
                        class="hidden md:inline-flex items-center gap-2 min-h-[44px] shrink-0 px-3 sm:px-4 py-2 rounded-xl border border-gray-200 bg-white text-sm font-medium text-gray-600 hover:bg-gray-50 transition shadow-sm"
                        title="Быстрый поиск (Ctrl+K)"
                        aria-label="Быстрый поиск по заказам, чатам и бронированиям">
                        <svg class="w-4 h-4 shrink-0 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <span>Поиск…</span>
                        <kbd class="text-[10px] px-1.5 py-0.5 rounded-md bg-gray-100 text-gray-500 font-mono border border-gray-200/80">Ctrl K</kbd>
                    </button>
                    <button type="button" @click="logoutAdmin()"
                        class="min-h-[44px] shrink-0 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition shadow-sm">
                        Выйти
                    </button>
                </div>
            </div><!-- /desktop header -->
        </header>
