            <!-- Модалка: полное создание правила упаковки -->
            <div x-show="packagingCreateOpen" x-cloak class="fixed inset-0 z-[56] flex items-center justify-center p-4 bg-black/40" @click.self="closePackagingCreateModal()">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 border border-gray-100" @click.stop role="dialog" aria-modal="true" aria-labelledby="packaging-create-modal-title">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div>
                            <h3 id="packaging-create-modal-title" class="text-xl font-bold text-gray-900">Новое правило упаковки</h3>
                            <p class="text-sm text-gray-500 mt-1">Заполните сразу все поля, чтобы не искать карточку после создания.</p>
                        </div>
                        <button type="button" @click="closePackagingCreateModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none shrink-0" aria-label="Закрыть окно нового правила упаковки">&times;</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Ключ kind *</label>
                            <input type="text" x-model="packagingCreateForm.kind" placeholder="например dessert"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm font-mono focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Название *</label>
                            <input type="text" x-model="packagingCreateForm.name" placeholder="Контейнер для десерта"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Цена, ₸</label>
                            <input type="number" min="0" step="1" x-model.number="packagingCreateForm.price"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Приоритет</label>
                            <input type="number" step="1" x-model.number="packagingCreateForm.sort_order"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Ключевые слова</label>
                            <input type="text" x-model="packagingCreateForm.keywords" placeholder="манты, шашлык или плов+1кг"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm font-mono focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Внутренний key (опц.)</label>
                            <input type="text" x-model="packagingCreateForm.option_key" placeholder="tabak, foil_kazan"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm font-mono focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Уровень</label>
                            <select x-model="packagingCreateForm.scope"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                                <option value="item">Позиция</option>
                                <option value="category">Категория</option>
                                <option value="order">Заказ</option>
                            </select>
                        </div>
                        <div x-show="packagingCreateForm.scope === 'category'">
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Категория</label>
                            <input type="text" x-model="packagingCreateForm.category_match" placeholder="Напитки"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">ID товара в iiko (опц.)</label>
                            <input type="text" x-model="packagingCreateForm.iiko_product_id" placeholder="UUID"
                                class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm font-mono focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <label class="md:col-span-2 inline-flex items-center gap-2 text-sm text-gray-700">
                            <input type="checkbox" x-model="packagingCreateForm.is_active" class="rounded border-gray-300 text-brand-600">
                            Активное правило
                        </label>
                    </div>

                    <p x-show="packagingCreateError" x-cloak class="text-sm text-red-600 mt-4 whitespace-pre-wrap" x-text="packagingCreateError"></p>

                    <div class="mt-5 flex items-center justify-end gap-3">
                        <button type="button" @click="closePackagingCreateModal()" :disabled="packagingCreateLoading"
                            class="px-4 py-2 rounded-xl border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-50">Отмена</button>
                        <button type="button" @click="submitPackagingCreate()" :disabled="packagingCreateLoading"
                            class="px-4 py-2 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-700 disabled:opacity-50">
                            <span x-show="!packagingCreateLoading">Добавить правило</span>
                            <span x-show="packagingCreateLoading" x-cloak>Сохранение…</span>
                        </button>
                    </div>
                </div>
            </div>
