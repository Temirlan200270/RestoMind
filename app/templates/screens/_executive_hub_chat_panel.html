<div class="flex flex-col h-full p-4 gap-4">
    <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
            <div class="text-sm font-bold text-slate-900">Агент RestoMind</div>
            <p class="mt-1 text-xs text-slate-500">Разбирает выбранный сигнал: деньги, причины, риски и следующий шаг владельца.</p>
        </div>
        <button type="button" class="ds-btn ds-btn-secondary ds-btn-sm shrink-0"
            x-show="!executiveHubChatFullscreen"
            @click="openExecutiveHubChatFullscreen()">
            Во весь экран
        </button>
    </div>

    <div class="rounded-xl border border-indigo-100 bg-indigo-50 p-3">
        <div class="text-[10px] font-bold uppercase tracking-wide text-indigo-700">Сейчас в разборе</div>
        <div class="mt-1 text-sm font-bold text-slate-950" x-text="executiveHubAgentTitle()"></div>
        <p class="mt-1 text-xs leading-relaxed text-slate-600" x-text="executiveHubAgentSummary()"></p>
    </div>

    <form class="flex flex-col gap-2" @submit.prevent="askIntelligence()">
        <textarea :rows="executiveHubChatFullscreen ? 5 : 3"
            class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 resize-none"
            x-model="intelligenceQuestion"
            placeholder="Почему упала выручка? Как поднять маржу? Покажи по часам."></textarea>
        <button type="submit" class="ds-btn ds-btn-primary ds-btn-sm self-start" :disabled="intelligenceAsking">
            <span x-show="!intelligenceAsking">Спросить агента</span>
            <span x-show="intelligenceAsking">Считаю…</span>
        </button>
    </form>

    <div class="rounded-xl bg-slate-50 border border-slate-100 p-3 text-sm text-slate-800"
        :class="executiveHubChatFullscreen ? 'min-h-[280px]' : 'min-h-[120px]'">
        <template x-if="intelligenceAnswer">
            <div>
                <div class="text-[10px] font-bold uppercase text-slate-400">Ответ</div>
                <p class="mt-2 leading-6 whitespace-pre-wrap" x-text="intelligenceAnswer"></p>
            </div>
        </template>
        <template x-if="!intelligenceAnswer">
            <p class="text-slate-500" x-text="executiveHubAgentSummary()"></p>
        </template>
    </div>

    <div class="space-y-2" x-show="(intelligencePendingActions || []).length" x-cloak>
        <div class="text-[10px] font-bold uppercase text-amber-700">Требует подтверждения</div>
        <template x-for="proposal in intelligencePendingActions" :key="'pending-action-' + proposal.id">
            <div class="rounded-xl border border-amber-200 bg-amber-50 p-3">
                <div class="text-sm font-semibold text-slate-900" x-text="proposal.title"></div>
                <p class="mt-1 text-xs text-slate-600" x-text="proposal.summary"></p>
                <div class="mt-2 flex gap-2">
                    <button type="button" class="ds-btn ds-btn-primary ds-btn-sm"
                        :disabled="executiveHubActionBusy"
                        @click="confirmIntelligencePendingAction(proposal.id)">Подтвердить</button>
                </div>
            </div>
        </template>
    </div>

    <div class="flex flex-wrap gap-2">
        <template x-for="row in (executiveHubBusinessQuestions.length ? executiveHubBusinessQuestions : intelligenceBusinessQuestions)" :key="'ehq-' + row.question">
            <button type="button"
                class="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:border-indigo-300 hover:text-indigo-700"
                @click="executiveHubAskCard({ chat_prompt: row.question })">
                <span x-text="row.question"></span>
            </button>
        </template>
    </div>
</div>
