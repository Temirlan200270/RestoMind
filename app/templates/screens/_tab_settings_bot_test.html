            <!-- ========== ЛАБОРАТОРИЯ БОТ / ИИ ========== -->
            <template x-if="currentTab === 'settings' && settingsTab === 'bot_test'">
            <div class="fade-in w-full max-w-6xl mx-auto lg:flex lg:gap-8 lg:items-start pb-16">
                {{ settings_tabs() }}
                <div class="flex-1 min-w-0 space-y-6">
                    <div class="rm-card-surface p-5 sm:p-6">
                        <div class="flex flex-wrap items-start justify-between gap-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">Лаборатория Бот / ИИ</h3>
                                <p class="text-sm text-slate-600 mt-1">Знания, правила допродаж, промпт и тестовый чат собраны в один рабочий контур.</p>
                            </div>
                            <div class="min-w-[9rem]" x-show="!isDemoSession" x-cloak>
                                <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
                                    <span>Готовность</span>
                                    <span class="tabular-nums" x-text="(setupStatus.score ?? 0) + '%'"></span>
                                </div>
                                <div class="mt-2 h-2 rounded-full bg-slate-100 overflow-hidden">
                                    <div class="h-full rounded-full bg-emerald-500 transition-all duration-700" :style="'width:' + (setupStatus.score || 0) + '%'"></div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <button type="button" @click="setSettingsTab('restaurant'); setTimeout(() => document.getElementById('settings-restaurant-knowledge')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50)"
                                class="text-left rounded-xl border border-slate-200 bg-white px-4 py-3 hover:bg-slate-50 min-h-[68px]">
                                <span class="block text-xs font-bold uppercase text-slate-400">Сборка знаний</span>
                                <span class="mt-1 block text-sm font-semibold text-slate-900"><span x-text="setupStatus.knowledge_items || 0"></span> записей</span>
                            </button>
                            <button type="button" @click="setSettingsTab('smart_sales')"
                                class="text-left rounded-xl border border-slate-200 bg-white px-4 py-3 hover:bg-slate-50 min-h-[68px]">
                                <span class="block text-xs font-bold uppercase text-slate-400">Допродажи</span>
                                <span class="mt-1 block text-sm font-semibold text-slate-900"><span x-text="setupStatus.upsell_rules || 0"></span> правил</span>
                            </button>
                            <button type="button" @click="setSettingsTab('restaurant'); setTimeout(() => document.getElementById('settings-restaurant-packaging')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50)"
                                class="text-left rounded-xl border border-slate-200 bg-white px-4 py-3 hover:bg-slate-50 min-h-[68px]">
                                <span class="block text-xs font-bold uppercase text-slate-400">Упаковка</span>
                                <span class="mt-1 block text-sm font-semibold text-slate-900"><span x-text="setupStatus.packaging_rules || 0"></span> правил</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_22rem] gap-6">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="bg-brand-700 px-5 py-3 flex items-center justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white font-bold text-sm">R</div>
                                    <div class="text-white">
                                        <div class="font-medium text-sm">RestoMind Bot</div>
                                        <div class="text-xs text-brand-100">Тестовый режим без отправки гостям</div>
                                    </div>
                                </div>
                                <span class="hidden sm:inline text-xs font-semibold text-brand-100" x-text="'AI API через ваш бэкенд'">AI API через ваш бэкенд</span>
                            </div>

                            <div class="p-5 max-h-[420px] overflow-y-auto space-y-3" id="testChatArea">
                                <template x-for="(msg, idx) in testMessages" :key="idx">
                                    <div :class="msg.role === 'user' ? 'justify-end' : 'justify-start'" class="flex">
                                        <div :class="msg.role === 'user'
                                            ? 'bg-brand-600 text-white rounded-2xl rounded-br-md'
                                            : 'bg-gray-100 text-gray-800 rounded-2xl rounded-bl-md'"
                                            class="max-w-[75%] px-4 py-2.5 text-sm whitespace-pre-line">
                                            <p x-show="msg.role === 'assistant' && msg.intent" class="text-[10px] text-gray-500 mb-1 font-mono" x-text="'intent: ' + msg.intent"></p>
                                            <div x-text="msg.text"></div>
                                        </div>
                                    </div>
                                </template>
                                <div x-show="!testMessages.length && !testLoading" class="rounded-xl border border-dashed border-gray-200 bg-gray-50 px-4 py-8 text-center text-sm text-gray-500">
                                    Напишите тестовый вопрос клиента: адрес, бронь, заказ или просьбу заменить позицию.
                                </div>
                                <div x-show="testLoading" class="flex justify-start">
                                    <div class="bg-gray-100 rounded-2xl rounded-bl-md px-4 py-3">
                                        <div class="flex gap-1">
                                            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
                                            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></span>
                                            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-gray-100 px-4 py-3 flex gap-3">
                                <input x-model="testInput" type="text" placeholder="Сообщение клиента..."
                                    class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                                    @keydown.enter="sendTestMessage()" :disabled="testLoading">
                                <button @click="sendTestMessage()" :disabled="testLoading || !testInput.trim()"
                                    class="px-5 py-2.5 bg-brand-600 text-white rounded-xl hover:bg-brand-700 transition font-medium text-sm disabled:opacity-50 min-h-[44px]"
                                    aria-label="Отправить тестовое сообщение">
                                    &#x27A4;
                                </button>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="rm-card-surface p-5">
                                <h4 class="text-sm font-bold text-slate-900">Промпт и источники</h4>
                                <p class="mt-2 text-sm text-slate-600">Ответ собирается из профиля ресторана, активной базы знаний, меню, стоп-листа и правил допродаж.</p>
                                <div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs text-slate-600">
                                    KPI допродаж: предложено, принято, конверсия, средний чек.
                                </div>
                            </div>
                            <div class="rm-card-surface p-5">
                                <h4 class="text-sm font-bold text-slate-900">Быстрые проверки</h4>
                                <div class="mt-3 flex flex-col gap-2">
                                    <button type="button" @click="testInput = 'Здравствуйте, хочу заказать плов на компанию и напитки'; sendTestMessage()"
                                        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-left text-xs font-semibold text-slate-800 hover:bg-slate-50 min-h-[44px]">Проверить заказ + допродажу</button>
                                    <button type="button" @click="testInput = 'Можно забронировать столик на пятницу вечером?'; sendTestMessage()"
                                        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-left text-xs font-semibold text-slate-800 hover:bg-slate-50 min-h-[44px]">Проверить бронь</button>
                                    <button type="button" @click="testInput = 'Где вы находитесь и есть ли парковка?'; sendTestMessage()"
                                        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-left text-xs font-semibold text-slate-800 hover:bg-slate-50 min-h-[44px]">Проверить базу знаний</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </template>
