            <!-- ========== БРЕНДИНГ (E2.2.F) ========== -->
            <template x-if="currentTab === 'settings' && settingsTab === 'branding'">
            <div class="fade-in w-full max-w-6xl mx-auto lg:flex lg:gap-8 lg:items-start pb-16">
                {{ settings_tabs() }}
                <div class="flex-1 min-w-0 space-y-6">
                <div class="rounded-2xl border border-indigo-100 bg-indigo-50/80 px-4 py-3 text-sm text-indigo-950">
                    <span class="font-semibold">Серверное сохранение</span> —
                    <span x-show="brandingApiUnavailable" x-cloak>Сохранение временно недоступно. Форма и предпросмотр работают — нажмите «Сохранить» после обновления платформы.</span>
                    <span x-show="!brandingApiUnavailable" x-cloak>Изменения отправляются на сервер; логотип — до 1 МБ, PNG или JPG.</span>
                </div>
                <div class="rm-card-surface p-6 space-y-6" @input="brandingDirty = true" @change="brandingDirty = true">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                        <div>
                            <h2 class="text-lg font-bold text-gray-900">Внешний вид в панели</h2>
                            <p class="text-sm text-gray-500 mt-1">Название бренда, цвет акцента и логотип отображаются в шапке панели управления.</p>
                        </div>
                        <button type="button" @click="saveBranding()" :disabled="brandingSaving || isDemoSession"
                            class="hidden md:inline-flex shrink-0 px-4 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 disabled:opacity-40">
                            <span x-show="!brandingSaving">Сохранить</span>
                            <span x-show="brandingSaving" x-cloak>Сохраняем…</span>
                        </button>
                    </div>
                    <p x-show="isDemoSession" x-cloak class="text-xs text-violet-700 font-medium">Демо-сессия: сохранение отключено.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Название бренда</label>
                            <input type="text" x-model="brandingDraft.brand_name" placeholder="Как видят гости и команда"
                                class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Акцентный цвет</label>
                            <div class="flex items-center gap-3">
                                <input type="color" aria-label="Акцентный цвет бренда" class="h-11 w-14 rounded-lg border border-gray-200 cursor-pointer bg-white p-1"
                                    :value="brandingDraft.brand_color_hex"
                                    @input="brandingDraft.brand_color_hex = normalizeBrandingColorHex($event.target.value)">
                                <input type="text" x-model="brandingDraft.brand_color_hex" dir="ltr"
                                    class="flex-1 rounded-xl border border-gray-200 px-4 py-3 text-sm bg-white font-mono"
                                    placeholder="#7B3F00" maxlength="7"
                                    @blur="brandingDraft.brand_color_hex = normalizeBrandingColorHex(brandingDraft.brand_color_hex)">
                            </div>
                            <p class="text-xs text-gray-500 mt-1.5">Используется для обводки аватара и кнопок в превью ниже.</p>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Логотип</label>
                            <input type="file" accept="image/png,image/jpeg" x-ref="brandingLogoInput" aria-label="Логотип бренда"
                                class="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-brand-50 file:text-brand-800 file:font-semibold"
                                @change="onBrandingLogoSelected($event)">
                            <p class="text-xs text-gray-500 mt-1.5" x-show="brandingLogoPendingLabel" x-text="brandingLogoPendingLabel"></p>
                        </div>
                    </div>
                    <div class="rounded-2xl border border-gray-100 bg-slate-50/80 p-5">
                        <p class="text-xs font-semibold text-gray-500 uppercase mb-3">Предпросмотр шапки</p>
                        <div class="flex items-center gap-3 rounded-xl bg-white border border-gray-100 px-4 py-3 shadow-sm"
                            :style="brandingPreviewHeaderStyle()">
                            <div class="h-9 w-9 rounded-xl overflow-hidden shrink-0 flex items-center justify-center text-white text-xs font-bold"
                                :style="'background:' + (brandingDraft.brand_color_hex || '#2563eb')">
                                <img x-show="brandingPreviewLogoSrc()" :src="brandingPreviewLogoSrc()" class="h-full w-full object-cover" alt="">
                                <span x-show="!brandingPreviewLogoSrc()" x-text="brandingPreviewInitials()"></span>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-bold text-gray-900 truncate" x-text="brandingPreviewTitle()"></div>
                                <div class="text-[10px] text-gray-500 truncate" x-show="userData?.tenant?.name && userData.tenant.name !== 'Default'" x-text="userData.tenant.name"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div x-show="brandingDirty" x-cloak class="rm-settings-savebar md:hidden">
                    <div class="min-w-0">
                        <div class="text-sm font-bold text-slate-900">Есть изменения</div>
                        <div class="text-xs text-slate-500" x-show="isDemoSession">В демо сохранение отключено</div>
                    </div>
                    <button type="button" @click="saveBranding()" :disabled="brandingSaving || isDemoSession"
                        class="shrink-0 px-4 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold disabled:opacity-40">
                        <span x-show="!brandingSaving">Сохранить</span>
                        <span x-show="brandingSaving" x-cloak>Сохраняем…</span>
                    </button>
                </div>
                </div>
            </div>
            </template>
