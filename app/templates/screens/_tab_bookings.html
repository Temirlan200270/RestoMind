            <!-- ========== БРОНИРОВАНИЯ ========== -->
            <div x-show="currentTab === 'bookings'" x-cloak class="fade-in space-y-4 pb-16">
                <!-- Шапка -->
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900">Бронирования</h2>
                        <p class="text-sm text-slate-500 mt-0.5">Столики и резервации из WhatsApp-бота</p>
                    </div>
                    <button type="button" @click="loadBookings()" class="ds-btn-secondary text-sm px-3 py-2 min-h-[40px]">
                        <svg class="w-4 h-4 mr-1.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Обновить
                    </button>
                </div>

                <!-- KPI-строка -->
                <div x-show="bookings.length > 0" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="ds-card px-4 py-3">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Всего</div>
                        <div class="text-2xl font-black tabular-nums text-slate-900" x-text="bookings.length"></div>
                    </div>
                    <div class="ds-card px-4 py-3">
                        <div class="text-xs font-semibold text-amber-600 uppercase tracking-wide mb-1">Ожидают</div>
                        <div class="text-2xl font-black tabular-nums text-amber-600" x-text="bookingStatsFor('pending')"></div>
                    </div>
                    <div class="ds-card px-4 py-3">
                        <div class="text-xs font-semibold text-emerald-600 uppercase tracking-wide mb-1">Подтверждены</div>
                        <div class="text-2xl font-black tabular-nums text-emerald-600" x-text="bookingStatsFor('confirmed')"></div>
                    </div>
                    <div class="ds-card px-4 py-3">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Отменены</div>
                        <div class="text-2xl font-black tabular-nums text-slate-400" x-text="bookingStatsFor('cancelled')"></div>
                    </div>
                </div>

                <!-- Фильтр по статусу -->
                <div x-show="bookings.length > 0" class="ds-segmented inline-flex gap-1 p-1 rounded-xl bg-gray-100">
                    <button type="button" @click="bookingStatusFilter = 'all'"
                        :class="bookingStatusFilter === 'all' ? 'ds-segmented-active' : ''"
                        class="px-3 py-1.5 rounded-lg text-sm font-semibold min-h-[36px]">
                        Все <span class="tabular-nums ml-1" x-text="bookings.length"></span>
                    </button>
                    <button type="button" @click="bookingStatusFilter = 'pending'"
                        :class="bookingStatusFilter === 'pending' ? 'ds-segmented-active' : ''"
                        class="px-3 py-1.5 rounded-lg text-sm font-semibold min-h-[36px]">
                        Ожидают
                    </button>
                    <button type="button" @click="bookingStatusFilter = 'confirmed'"
                        :class="bookingStatusFilter === 'confirmed' ? 'ds-segmented-active' : ''"
                        class="px-3 py-1.5 rounded-lg text-sm font-semibold min-h-[36px]">
                        Подтверждены
                    </button>
                    <button type="button" @click="bookingStatusFilter = 'cancelled'"
                        :class="bookingStatusFilter === 'cancelled' ? 'ds-segmented-active' : ''"
                        class="px-3 py-1.5 rounded-lg text-sm font-semibold min-h-[36px]">
                        Отменены
                    </button>
                </div>

                <!-- Список -->
                <div class="grid gap-3">
                    <template x-for="b in filteredBookings" :key="b.id">
                        <button type="button" @click="openBookingModal(b)"
                            class="w-full text-left ds-card p-5 hover:shadow-md hover:border-emerald-200/80 transition cursor-pointer group">
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex items-center gap-4 min-w-0">
                                    <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-2xl shrink-0 group-hover:bg-emerald-100/90 transition-colors">&#x1F37D;</div>
                                    <div class="min-w-0">
                                        <div class="font-semibold text-gray-900" x-text="fmt.bookingDate(b.date) + ' в ' + b.time?.slice(0,5)"></div>
                                        <div class="text-xs font-mono text-gray-500 truncate" x-show="b.user_phone" x-text="b.user_phone"></div>
                                        <div class="text-sm text-gray-600 truncate" x-show="b.user_name" x-text="b.user_name"></div>
                                        <div class="text-sm text-gray-500 mt-0.5">
                                            <span x-text="b.guests"></span> гост.
                                            <span x-show="b.comment" class="ml-2 text-gray-400 line-clamp-1" x-text="'— ' + b.comment"></span>
                                        </div>
                                        <div x-show="b.linked_order_id" class="text-[11px] text-teal-700 font-semibold mt-1">
                                            Предзаказ · заказ #<span x-text="b.linked_order_id"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end gap-1.5 shrink-0">
                                    <span class="text-[11px] px-2.5 py-0.5 rounded-lg font-medium bg-violet-50 text-violet-800 border border-violet-100"
                                        x-text="bookingHallLabel(b.hall)"></span>
                                    <span :class="statusConfig[b.status]?.class || 'bg-gray-100 text-gray-600'" x-text="statusConfig[b.status]?.label || b.status" class="px-3 py-1 rounded-full text-xs font-medium"></span>
                                </div>
                            </div>
                        </button>
                    </template>
                    <div x-show="filteredBookings.length === 0 && bookings.length === 0" class="text-center py-16 text-gray-400">
                        <div class="text-5xl mb-3">&#x1F4C5;</div>
                        <div class="text-lg font-semibold">Бронирований пока нет</div>
                        <p class="text-sm mt-1">Когда клиенты забронируют столик через бота, они появятся здесь</p>
                    </div>
                    <div x-show="filteredBookings.length === 0 && bookings.length > 0" class="text-center py-10 text-gray-400">
                        <div class="text-3xl mb-2">&#x1F50D;</div>
                        <div class="text-sm">По выбранному фильтру ничего нет</div>
                    </div>
                </div>
            </div>
