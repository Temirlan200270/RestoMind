            <div x-show="menuEditOpen" x-cloak x-transition.opacity class="fixed inset-0 z-[80] flex items-center justify-center p-4"
                @keydown.escape.window="closeMenuEdit()">
                <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="closeMenuEdit()"></div>
                <div class="relative bg-white rounded-2xl shadow-xl border border-gray-100 w-full max-w-lg max-h-[90vh] overflow-y-auto p-6" @click.stop role="dialog" aria-modal="true" aria-labelledby="menu-edit-modal-title">
                    <h3 id="menu-edit-modal-title" class="text-lg font-bold text-gray-900 mb-1" x-text="menuEditForm.id != null ? 'Редактирование позиции' : 'Новая позиция'"></h3>
                    <p class="text-xs text-gray-500 mb-4">Изменения сразу видны боту при следующем запросе меню.</p>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Название</label>
                            <input type="text" x-model="menuEditForm.name"
                                class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Например, Плов праздничный">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Раздел</label>
                            <input type="text" x-model="menuEditForm.category" list="menu-category-suggestions"
                                class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Горячие блюда">
                            <datalist id="menu-category-suggestions">
                                <template x-for="cat in menuCategories" :key="cat">
                                    <option :value="cat"></option>
                                </template>
                            </datalist>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Цена (₸)</label>
                            <input type="number" min="0" step="1" x-model.number="menuEditForm.price"
                                class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Описание</label>
                            <textarea x-model="menuEditForm.description" rows="3"
                                class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 resize-y" placeholder="Состав, порция…"></textarea>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Теги / сочетаемость (для ИИ)</label>
                            <textarea x-model="menuEditForm.tags" rows="2"
                                class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 resize-y"
                                placeholder="Через запятую: хит, к нему: ачичук, чай грузинский"></textarea>
                            <p class="mt-1 text-[11px] text-gray-400 leading-snug">Бот использует теги в первую очередь для рекомендаций к этому блюду (названия как в меню).</p>
                        </div>
                        <div class="rounded-xl border border-slate-200 bg-slate-50/80 p-3 space-y-3">
                            <p class="text-xs font-semibold text-slate-700">Профиль для ИИ (порции и ограничения)</p>
                            <div>
                                <label class="text-[11px] font-semibold text-gray-500 uppercase">Тип порции</label>
                                <select x-model="menuEditForm.portion_kind" class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white">
                                    <option value="single">Порционное (на одного)</option>
                                    <option value="shareable">На компанию / шеринг</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[11px] font-semibold text-gray-500 uppercase">Гостей от</label>
                                    <input type="number" min="1" max="99" x-model.number="menuEditForm.serves_min" class="mt-1 w-full rounded-xl border border-gray-200 px-2 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="text-[11px] font-semibold text-gray-500 uppercase">Гостей до</label>
                                    <input type="number" min="1" max="99" x-model.number="menuEditForm.serves_max" class="mt-1 w-full rounded-xl border border-gray-200 px-2 py-2 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="text-[11px] font-semibold text-gray-500 uppercase">Аллергены</label>
                                <input type="text" x-model="menuEditForm.allergens" placeholder="орехи, молоко, глютен…"
                                    class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm">
                            </div>
                            <div>
                                <label class="text-[11px] font-semibold text-gray-500 uppercase">Краткий состав</label>
                                <textarea x-model="menuEditForm.ingredients_summary" rows="2" placeholder="Для подсказок гостю и кухне"
                                    class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm resize-y"></textarea>
                            </div>
                            <div>
                                <label class="text-[11px] font-semibold text-gray-500 uppercase">Диетические теги</label>
                                <input type="text" x-model="menuEditForm.dietary_tags" placeholder="веган, халяль, безлактозное…"
                                    class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm">
                            </div>
                            <div>
                                <label class="text-[11px] font-semibold text-gray-500 uppercase">Пары допродаж (текст)</label>
                                <input type="text" x-model="menuEditForm.upsell_pairs" placeholder="UUID iiko или названия через запятую"
                                    class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm font-mono text-xs">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Фото (URL, необязательно)</label>
                            <input type="url" x-model="menuEditForm.image_url"
                                class="mt-1 w-full rounded-xl border border-gray-200 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="https://…">
                        </div>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" x-model="menuEditForm.is_available" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                            <span class="text-sm text-gray-700">В наличии (не в стоп-листе)</span>
                        </label>
                    </div>
                    <div class="mt-6 flex flex-wrap gap-2 justify-end">
                        <button type="button" @click="closeMenuEdit()" :disabled="menuEditSaving"
                            class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-xl disabled:opacity-50">Отмена</button>
                        <button type="button" x-show="menuEditForm.id != null" @click="deleteMenuItemFromModal()"
                            :disabled="menuEditSaving"
                            class="px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 rounded-xl disabled:opacity-50">Удалить</button>
                        <button type="button" @click="saveMenuItem()"
                            :disabled="menuEditSaving || !String(menuEditForm.name || '').trim()"
                            class="px-5 py-2 text-sm font-semibold bg-brand-600 text-white rounded-xl hover:bg-brand-700 disabled:opacity-40 shadow-sm">
                            <span x-show="!menuEditSaving">Сохранить</span>
                            <span x-show="menuEditSaving">Сохранение…</span>
                        </button>
                    </div>
                </div>
            </div>
            </template>
