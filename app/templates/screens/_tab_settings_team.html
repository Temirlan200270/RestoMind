            <!-- ========== КОМАНДА ========== -->
            <template x-if="currentTab === 'settings' && settingsTab === 'team'">
            <div class="fade-in w-full max-w-6xl mx-auto lg:flex lg:gap-8 lg:items-start">
                {{ settings_tabs() }}
                <div class="flex-1 min-w-0 space-y-6">
                <div class="rm-card-surface p-6 mb-6">
                    <h3 class="font-semibold text-lg text-gray-900 mb-1">Команда</h3>
                    <p class="text-sm text-gray-500 mb-6">Добавляйте сотрудников и выдавайте доступ к панели управления.</p>

                    <div class="grid sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Email сотрудника</label>
                            <input type="email" x-model="teamNewEmail" autocomplete="off"
                                placeholder="employee@restaurant.com"
                                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Роль</label>
                            <select x-model="teamNewRole" class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm bg-white">
                                <option value="operator">Сотрудник</option>
                                <option value="manager">Менеджер</option>
                                <option value="admin">Администратор</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Пароль (опционально)</label>
                            <input type="text" x-model="teamNewPassword" autocomplete="off"
                                placeholder="Если пусто — создадим временный"
                                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Должность (StaffMind)</label>
                            <input type="text" x-model="teamNewMetaTitle" autocomplete="off" placeholder="Кассир, официант…"
                                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Отдел</label>
                            <input type="text" x-model="teamNewMetaDepartment" autocomplete="off" placeholder="Зал, кухня…"
                                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                        <div class="sm:col-span-2" x-show="teamLocationOptions().length > 1" x-cloak>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Точки доступа</label>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="loc in teamLocationOptions()" :key="'new-loc-' + loc.id">
                                    <label class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm cursor-pointer">
                                        <input type="checkbox" :value="loc.id"
                                            @change="($event.target.checked ? teamNewLocationIds.push(loc.id) : (teamNewLocationIds = teamNewLocationIds.filter((x) => x !== loc.id)))"
                                            :checked="teamNewLocationIds.includes(loc.id)">
                                        <span x-text="loc.name"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 flex items-center gap-3 flex-wrap">
                        <button type="button" @click="createTeamMember()" :disabled="teamCreateLoading"
                            class="px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition disabled:opacity-50">
                            <span x-show="!teamCreateLoading">Добавить сотрудника</span>
                            <span x-show="teamCreateLoading" x-cloak>Сохраняем…</span>
                        </button>
                        <button type="button" @click="loadTeam()" :disabled="teamLoading"
                            class="px-5 py-3 rounded-xl border border-gray-200 bg-white text-gray-800 font-semibold text-sm hover:bg-gray-50 transition disabled:opacity-50">
                            Обновить список
                        </button>
                    </div>

                    <div class="mt-4" x-show="teamTempPassword" x-cloak>
                        <div class="rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4">
                            <div class="font-semibold text-amber-900">Временный пароль создан</div>
                            <div class="text-sm text-amber-800 mt-1">
                                Передайте сотруднику пароль (показывается один раз):
                                <span class="font-mono font-semibold" x-text="teamTempPassword"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="rm-card-surface p-6">
                    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-5">
                        <div>
                            <h4 class="font-semibold text-gray-900">StaffMind onboarding</h4>
                            <p class="text-sm text-gray-500 mt-1">Запускайте короткие сессии обучения и проверяйте ответы из базы знаний.</p>
                        </div>
                        <button type="button" @click="loadStaffMindOnboarding()" :disabled="staffMindLoading"
                            class="px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-gray-800 font-semibold text-sm hover:bg-gray-50 transition disabled:opacity-50">
                            <span x-text="staffMindLoading ? 'Загрузка…' : 'Обновить'"></span>
                        </button>
                    </div>

                    <div class="grid sm:grid-cols-[1fr_160px_auto] gap-3 mb-3">
                        <input type="tel" x-model="staffMindPhone" autocomplete="off" placeholder="+77001234567"
                            :disabled="!canStaffStartStaffMind()"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 disabled:opacity-60">
                        <input type="text" x-model="staffMindRole" autocomplete="off" placeholder="cashier"
                            :disabled="!canStaffStartStaffMind()"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 disabled:opacity-60">
                        <button type="button" @click="startStaffMindOnboarding()"
                            :disabled="staffMindStartLoading || !canStaffStartStaffMind()"
                            class="px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition disabled:opacity-50">
                            <span x-text="staffMindStartLoading ? 'Запуск…' : 'Запустить'"></span>
                        </button>
                    </div>
                    <p x-show="staffRbacHint('manager')" x-cloak class="text-[11px] text-amber-700/90 mb-5" x-text="staffRbacHint('manager')"></p>

                    <div x-show="staffMindLoading && !staffMindSessions.length" class="h-20 rounded-xl bg-gray-100 animate-pulse"></div>
                    <div class="space-y-3">
                        <template x-for="s in staffMindSessions" :key="'staffmind-' + s.id">
                            <div class="rounded-2xl border border-gray-100 bg-gray-50/60 p-4">
                                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                                    <div>
                                        <div class="font-semibold text-gray-900 text-sm" x-text="s.phone"></div>
                                        <div class="text-xs text-gray-500">
                                            <span x-text="s.role || 'staff'"></span> · шаг <span x-text="s.current_step || 0"></span>
                                        </div>
                                    </div>
                                    <span class="self-start sm:self-auto text-[10px] font-bold uppercase px-2 py-0.5 rounded-full"
                                        :class="s.status === 'active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'"
                                        x-text="s.status"></span>
                                </div>
                                <div class="mt-3 grid sm:grid-cols-[1fr_auto] gap-2">
                                    <input type="text" x-model="staffMindQuestionById[s.id]" placeholder="Вопрос сотрудника"
                                        :disabled="!canStaffStartStaffMind()"
                                        class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 disabled:opacity-60">
                                    <button type="button" @click="askStaffMind(s.id)"
                                        :disabled="staffMindAskLoadingId === s.id || !canStaffStartStaffMind()"
                                        class="px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-gray-800 font-semibold text-sm hover:bg-gray-50 transition disabled:opacity-50">
                                        <span x-text="staffMindAskLoadingId === s.id ? '…' : 'Спросить'"></span>
                                    </button>
                                </div>
                                <div x-show="s.last_answer" x-cloak class="mt-3 rounded-xl bg-white border border-gray-100 p-3 text-sm text-gray-700 whitespace-pre-wrap" x-text="s.last_answer"></div>
                            </div>
                        </template>
                    </div>

                    <div x-show="!staffMindLoading && staffMindSessions.length === 0" x-cloak class="rm-empty-panel py-8">
                        <p class="text-sm font-semibold text-gray-800 mb-1">Сессий StaffMind пока нет</p>
                        <p class="text-xs text-gray-500 max-w-sm">Добавьте телефон сотрудника и роль, чтобы стартовать onboarding.</p>
                    </div>
                </div>

                <div class="rm-card-surface p-6">
                    <div class="flex items-center justify-between gap-3 mb-4">
                        <h4 class="font-semibold text-gray-900">Сотрудники</h4>
                        <div class="text-xs text-gray-500" x-show="teamLoading" x-cloak>Загрузка…</div>
                    </div>

                    <div x-show="teamError" x-cloak class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" x-text="teamError"></div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <template x-for="u in teamUsers" :key="'staff-' + u.id">
                            <div class="rounded-2xl border border-gray-100 bg-gray-50/50 p-4 flex flex-col gap-2 ring-1 ring-slate-900/5">
                                <div class="flex items-start justify-between gap-2">
                                    <div class="font-semibold text-gray-900 text-sm break-all min-w-0" x-text="u.email"></div>
                                    <span class="shrink-0 text-[10px] font-bold uppercase px-2 py-0.5 rounded-full"
                                        :class="u.role === 'admin' ? 'bg-violet-100 text-violet-800' : (u.role === 'manager' ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700')"
                                        x-text="u.role === 'admin' ? 'Админ' : (u.role === 'manager' ? 'Менеджер' : 'Сотрудник')"></span>
                                </div>
                                <div class="text-xs text-gray-600" x-show="u.role_metadata && (u.role_metadata.title || u.role_metadata.department)" x-cloak>
                                    <span x-text="[u.role_metadata?.title, u.role_metadata?.department].filter(Boolean).join(' · ')"></span>
                                </div>
                                <div class="text-xs text-gray-500" x-show="Array.isArray(u.assigned_location_ids) && u.assigned_location_ids.length" x-cloak>
                                    Точки: <span x-text="u.assigned_location_ids.length"></span>
                                </div>
                                <div class="flex items-center gap-2 text-xs text-gray-600">
                                    <span class="h-2 w-2 rounded-full shrink-0" :class="u.is_active ? 'bg-emerald-500' : 'bg-gray-300'"></span>
                                    <span x-text="u.is_active ? 'Доступ активен' : 'Доступ отключён'"></span>
                                </div>
                                <div class="text-xs text-gray-400" x-text="u.created_at ? ('Создан: ' + fmt.date(u.created_at)) : ''"></div>
                                <button type="button" @click="openTeamEdit(u)"
                                    class="self-start mt-1 px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-xs font-semibold text-gray-700 hover:bg-gray-50">
                                    Метаданные / точки
                                </button>
                                <div x-show="teamEditId === u.id" x-cloak class="mt-2 pt-3 border-t border-gray-200 space-y-3">
                                    <select x-model="teamEditRole" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm bg-white">
                                        <option value="operator">Сотрудник</option>
                                        <option value="manager">Менеджер</option>
                                        <option value="admin">Администратор</option>
                                    </select>
                                    <input type="text" x-model="teamEditMetaTitle" placeholder="Должность"
                                        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm">
                                    <input type="text" x-model="teamEditMetaDepartment" placeholder="Отдел"
                                        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm">
                                    <div x-show="teamLocationOptions().length > 0" class="flex flex-wrap gap-2">
                                        <template x-for="loc in teamLocationOptions()" :key="'edit-loc-' + loc.id">
                                            <label class="inline-flex items-center gap-2 px-2 py-1 rounded-lg border border-gray-200 bg-white text-xs">
                                                <input type="checkbox" :value="loc.id"
                                                    @change="($event.target.checked ? teamEditLocationIds.push(loc.id) : (teamEditLocationIds = teamEditLocationIds.filter((x) => x !== loc.id)))"
                                                    :checked="teamEditLocationIds.includes(loc.id)">
                                                <span x-text="loc.name"></span>
                                            </label>
                                        </template>
                                    </div>
                                    <div class="flex gap-2">
                                        <button type="button" @click="saveTeamMemberMeta()" :disabled="teamEditSaving"
                                            class="px-3 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold disabled:opacity-50">Сохранить</button>
                                        <button type="button" @click="cancelTeamEdit()"
                                            class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-semibold">Отмена</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div x-show="!teamLoading && teamUsers.length === 0" x-cloak class="rm-empty-panel py-10">
                        <p class="text-sm font-semibold text-gray-800 mb-1">Пока нет сотрудников</p>
                        <p class="text-xs text-gray-500 mb-4 max-w-sm">Добавьте первого — и выдайте доступ к панели.</p>
                    </div>
                </div>
                </div>
            </div>
            </template>
