<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на подключение — RestoMind</title>
    <link rel="stylesheet" href="/static/css/admin.css?v={{ asset_ver }}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
<div class="max-w-2xl mx-auto px-4 py-10" x-data="requestAccessPage()">
    <a href="/admin" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-700 mb-4">&larr; Вход в админку</a>
    <div class="rounded-2xl bg-white border border-slate-200 shadow-sm p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-900">Подключить мой ресторан</h1>
        <p class="text-sm text-slate-500 mt-2">Оставьте заявку, мы свяжемся с вами и подключим всё под ключ.</p>

        <div x-show="success" class="mt-5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 px-4 py-3 text-sm">
            Заявка принята. Мы свяжемся с вами в ближайшее время.
        </div>
        <div x-show="error" x-cloak class="mt-5 rounded-xl border border-red-200 bg-red-50 text-red-700 px-4 py-3 text-sm" x-text="error"></div>

        <form class="mt-6 space-y-4" @submit.prevent="submit()">
            <label class="block">
                <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Название ресторана</span>
                <input x-model="form.restaurant_name" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Пловхана Павлодар">
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="block">
                    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Контактное лицо</span>
                    <input x-model="form.contact_name" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Алия">
                </label>
                <label class="block">
                    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Телефон</span>
                    <input x-model="form.phone" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="+7 7xx xxx xx xx">
                </label>
            </div>
            <label class="block">
                <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Email</span>
                <input type="email" x-model="form.email" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="owner@restaurant.kz">
            </label>
            <label class="inline-flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" x-model="form.has_iiko" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500">
                У нас уже есть iiko
            </label>
            <label class="block">
                <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Комментарий</span>
                <textarea x-model="form.note" rows="4" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Удобное время для созвона, пожелания по запуску..."></textarea>
            </label>
            <button type="submit" :disabled="loading || success" class="w-full py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition disabled:opacity-60">
                <span x-show="!loading">Отправить заявку</span>
                <span x-show="loading" x-cloak>Отправка...</span>
            </button>
        </form>
    </div>
</div>

<script>
function requestAccessPage() {
    return {
        loading: false,
        success: false,
        error: '',
        form: {
            restaurant_name: '',
            contact_name: '',
            phone: '',
            email: '',
            has_iiko: false,
            note: '',
        },
        async submit() {
            this.error = '';
            this.loading = true;
            try {
                const res = await fetch('/api/admin/auth/request-access', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    this.error = typeof data.detail === 'string' ? data.detail : 'Не удалось отправить заявку.';
                    return;
                }
                this.success = true;
            } catch {
                this.error = 'Ошибка сети. Попробуйте ещё раз.';
            } finally {
                this.loading = false;
            }
        },
    };
}
</script>
</body>
</html>
