{% macro iiko_error(order_var='order', mt_class='mt-3') -%}
<div x-show="{{ order_var }}.iiko_last_error" class="{{ mt_class }} flex gap-2.5 rounded-xl border-2 border-red-400 bg-red-50/95 px-3 py-2.5 shadow-inner" role="alert">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-red-600 text-white text-base font-black leading-none shadow-sm" aria-hidden="true">!</div>
    <div class="min-w-0">
        <p class="text-[10px] font-bold uppercase tracking-wider text-red-900">Ошибка iiko</p>
        <p class="text-xs text-red-900 font-semibold leading-snug break-words mt-0.5" x-text="{{ order_var }}.iiko_last_error"></p>
    </div>
</div>
{%- endmacro %}
