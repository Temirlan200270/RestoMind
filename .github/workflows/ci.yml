name: CI — Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история для git diff origin/main...HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "from app.main import app; print('Import OK')"

      - name: Smart tests (only affected by changed files)
        run: python scripts/smart_test.py --base origin/main

      - name: Full suite on main branch push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python -m pytest tests/ -q --tb=short -m "not regression"
