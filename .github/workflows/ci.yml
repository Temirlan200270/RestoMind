name: CI — Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Явные права: checkout только читает репо (избегает generic 403).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restomind
          POSTGRES_PASSWORD: restomind_secret
          POSTGRES_DB: restomind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restomind -d restomind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_MODE: postgres
      DATABASE_URL: postgresql+asyncpg://restomind:restomind_secret@localhost:5432/restomind_test
      TEST_DATABASE_URL: postgresql+asyncpg://restomind:restomind_secret@localhost:5432/restomind_test
      REDIS_MEMORY_ONLY: "true"
      DATABASE_SSL_SKIP_VERIFY: "true"
      RESTOMIND_TEST_POSTGRES: "true"

    steps:
      # Shallow checkout + точечный fetch main — меньше RPC-сбоев, чем fetch-depth: 0.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch comparison ref (for smart_test)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
          else
            git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main || \
            git fetch --no-tags --depth=50 origin "${{ github.event.pull_request.base.ref || 'main' }}:refs/remotes/origin/main"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mark Alembic head for Postgres test DB
        run: python -m alembic stamp head

      - name: Check imports
        run: python -c "from app.main import app; print('Import OK')"

      - name: Smart tests (only affected by changed files)
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/smart_test.py --base "${{ github.event.before }}"
          else
            python scripts/smart_test.py --base origin/main
          fi

      - name: Full suite on main branch push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python -m pytest tests/ -q --tb=short -m "not regression"
